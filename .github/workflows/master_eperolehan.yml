# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - eperolehan

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, pdo, bcmath

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Create production directories
        run: |
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache/data
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Set directory permissions
        run: |
          chmod -R 775 storage
          chmod -R 775 bootstrap/cache

      - name: Make deployment scripts executable
        run: |
          chmod +x startup.sh
          chmod +x deploy.sh

      - name: Zip artifact for deployment
        run: zip -r release.zip . -x "*.git*" "node_modules/*" "tests/*" ".env*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Unzip artifact for deployment
        run: unzip release.zip -d .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_364EF80149B94C6399276BDF9FE2650A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1B964DDEFC7B40B0BB01B76F11B9620A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_21F13B3AA36446A7B36F583ED420EC83 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'eperolehan'
          slot-name: 'Production'
          package: .

      - name: 'Configure Startup Script'
        run: |
          az webapp config set --name eperolehan --resource-group eperolehan_group --startup-file "/home/site/wwwroot/startup.sh" || echo "Startup script configuration may not be supported on this plan"

      - name: 'Run Post-Deployment Commands'
        run: |
          echo "Running post-deployment setup..."
          az webapp ssh --name eperolehan --resource-group eperolehan_group --command "cd /home/site/wwwroot && bash deploy.sh" || \
          az webapp ssh --name eperolehan --resource-group eperolehan_group --command "cd /home/site/wwwroot && php artisan migrate --force && php artisan storage:link && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan optimize" || \
          echo "SSH commands may not be available. Please run artisan commands manually in Azure console."
